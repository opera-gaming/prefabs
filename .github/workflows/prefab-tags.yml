name: Update prefab-tags.json

# gmx discovers this catalog's tags by fetching prefab-tags.json over
# raw.githubusercontent.com (no API, works in sandboxed environments).
# The file must be regenerated AFTER a tag lands — the pushed tag can't be
# in the copy the author committed — so this runs on every tag push.
# Byte-compatible with `gmx prefab reindex` output.
on:
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Regenerate and commit
        run: |
          git fetch --tags --force --quiet
          git tag --list \
            | jq --raw-input --slurp '{schema_version: 1, tags: (split("\n") | map(select(length > 0)))}' \
            > prefab-tags.json
          if git diff --quiet -- prefab-tags.json; then
            echo "prefab-tags.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prefab-tags.json
          git commit -m "Update prefab-tags.json"
          git push origin HEAD:main
