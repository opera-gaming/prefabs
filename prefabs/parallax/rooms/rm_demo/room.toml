#:schema ../../.gm-schema/v1.json#room

# A real view that starts away from the origin, and a room wide enough to
# scroll in. The demo used a stand-in camera in a room with no view, which
# meant it drew correctly while `parallax_draw` was placing every layer at
# the room origin — the defect could not show up here.
size = { width = 3840, height = 540 }
enable_views = true

[[views]]
visible = true
x_view = 1200
w_view = 960
h_view = 540
w_port = 960
h_port = 540
