#:schema ../../.gm-schema/v1.json#tileset

# The sheet's first row is blank on purpose: tile index 0 is GameMaker's empty
# tile, so the 47-tile template starts on row 1 (`derive --origin 1,0`) and no
# art lands in a cell nothing can name.
sprite = "spr_terrain_sheet"

[tile_size]
width = 32
height = 32

[autotile.default]
template = "sides_47"

[autotile.default.tiles]
"ESW|" = 28
