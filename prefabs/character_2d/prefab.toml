name = "character_2d"
license = "Apache-2.0"
description = "A side-view paper-doll character to build on: a placeholder grey mannequin rig with idle, walk, jump and two get-up clips, tap/click-to-walk (tap above it to jump), a kinematic capsule so it moves through a physics world, a ground shadow, and a ragdoll it gets up from. No world, no enemies, no UI. Re-skin it with the generating-rig-characters skill; drop it into sidescroller_world."
category = "character"
tags = ["role:character", "role:player", "projection:side-view", "style:placeholder", "capability:rig", "capability:ragdoll", "capability:physics", "capability:touch"]
asset_bundle = false

# Demo-only: a flat room with a floor and an autoplay driver, so `gmx run` here
# shows the character walking, jumping and ragdolling. Consumers get none of it.
exclude = ["objects/obj_demo", "rooms/rm_demo"]

[assets."objects/obj_character"]
description = "The character. Variables: rig_asset (-1 = the mannequin), char_scale (0.8), tap_control (true). Tap beside it to walk there, above its head to jump. Ragdolls via character_ragdoll(); gets up by itself. Follows the sidescroller_world hand-off globals when they exist."
tags = ["asset_type:object", "role:player"]

[assets."objects/obj_ragdoll_part"]
description = "One limb body while the character is a ragdoll; created by the runtime from the rig's layout. Collides with obj_solid."
tags = ["asset_type:object", "role:collider"]

[assets."objects/obj_solid"]
description = "What the ragdoll and the capsule collide with: a static 1×1 box scaled per instance. The character lays its own floor/walls from it on the world's ground line at runtime, so no world needs to know this prefab."
tags = ["asset_type:object", "role:collider"]

[assets."rigs/rig_mannequin"]
description = "Placeholder side-view rig: a grey featureless mannequin with joint seams. Generated by the generating-rig-characters skill; replace with your own rig and point rig_asset at it."
tags = ["asset_type:rig", "style:placeholder"]

[assets."sprites/spr_mannequin_atlas"]
description = "The mannequin's 5-part atlas (for_3d)."
tags = ["asset_type:sprite", "role:atlas"]

[assets."clips/clip_idle"]
description = "Looping idle (Mixamo 'Happy Idle')."
tags = ["asset_type:clip", "state:idle"]

[assets."clips/clip_walk"]
description = "Looping walk with root motion; the character drives itself with it."
tags = ["asset_type:clip", "state:walk"]

[assets."clips/clip_run"]
description = "Looping run with root motion; marks the same `left-foot` stride phase as clip_walk, so a walk/run switch lands on the matching step."
tags = ["asset_type:clip", "state:run"]

[assets."clips/clip_jump"]
description = "One-shot jump with root motion (Mixamo 'Jump'), 2.2 s."
tags = ["asset_type:clip", "state:jump"]

[assets."clips/clip_kick"]
description = "One-shot kick; the two `hit` markers are the moments character_kick_hit tests the leading foot against."
tags = ["asset_type:clip", "state:kick"]

[assets."clips/clip_getup_front"]
description = "Get up from lying face down; `rise` and `upright` markers drive the ragdoll hand-off."
tags = ["asset_type:clip", "state:getup"]

[assets."clips/clip_getup_back"]
description = "Get up from lying on the back; `rise` and `upright` markers drive the ragdoll hand-off."
tags = ["asset_type:clip", "state:getup"]

[assets."scripts/character_2d_api"]
description = "character_ragdoll(inst, ix, iy), character_set_rig(inst, rig), character_walk_to(inst, x), character_jump(inst), character_ragdoll_tuning() — the whole API; plus the ragdoll state machine."
tags = ["asset_type:script", "role:api"]
