#:schema ../../.gm-schema/v1.json#room

# One 1600x900 backdrop drawn at 2x. The view is a 1600x900 window onto it, so
# there is room to walk and for the camera to follow.
size = { width = 3200, height = 1800 }
enable_views = true

# Box2D on, so ragdolls and thrown things work out of the box. Default gravity
# (10) is ~100 px/s^2 at the 0.1 px->m scale, which reads floaty.
physics_world = true
physics_gravity_y = 120.0
physics_pix_to_meters = 0.1

[[views]]
visible = true
x_view = 0
y_view = 900
w_view = 1600
h_view = 900
w_port = 1600
h_port = 900
