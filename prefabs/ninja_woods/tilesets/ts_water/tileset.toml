"NESW|NE,SE,SW" = 2
"NESW|NE,SW" = 2
"NESW|NW" = 2
"NESW|NW,SE" = 2
"NESW|NW,SE,SW" = 2
"NESW|NW,SW" = 2
"NESW|SE" = 2
"NESW|SE,SW" = 2
