#:schema ../../.gm-schema/v1.json#shader

[host]
kind = "subject"
margin = 0.5
snapshot = "uExpRate"

[[uniform]]
name = "uExpRate"
label = "Rate"
default = 0.8
min = 0.2
max = 2.5
step = 0.05

[[uniform]]
name = "uExpRadius"
label = "Radius"
default = 0.3
min = 0.1
max = 0.5
step = 0.01

[[uniform]]
name = "uExpDebris"
label = "Debris"
default = 0.7
step = 0.01

[[uniform]]
name = "uExpFlash"
label = "Flash"
default = 1.0
max = 2.0
step = 0.05

[[uniform]]
name = "uExpFlashLen"
label = "Flash length"
default = 0.3
min = 0.05
max = 1.5
step = 0.05
